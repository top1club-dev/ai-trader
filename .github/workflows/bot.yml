name: AI Bot
on:
  schedule:
    - cron: "40 3 * * 1-5"    # 9:10 AM IST, sirf Mon-Fri  (pehla session)
    - cron: "25 9 * * 1-5"    # 2:55 PM IST, sirf Mon-Fri  (doosra session, market close tak)
  workflow_dispatch:           # haath se test: Actions tab > Run workflow
concurrency:
  group: ai-bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      REPORT_DIR: docs
      TZ: Asia/Kolkata
    steps:
      - name: Weekend guard
        id: guard
        run: |
          if [ "$(date +%u)" -ge 6 ]; then echo "Weekend hai, aaj kuch nahi."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-live.txt
          mkdir -p models docs
      - name: Pehli baar model train (sirf agar repo mein model nahi hai)
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ ! -f models/ppo_latest.zip ]; then
            python trading_ai.py --market india --tfs 15m,30m,1h --steps 300000
          fi
      - name: Website server + Bot (market ke time)
        if: steps.guard.outputs.skip != 'true'
        run: |
          python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:8000/api/bot/state > /dev/null && break; sleep 2; done
          python bot.py --stop-at 15:36 --max-minutes 335 --push-every 30
      - name: Roz ka seekhna (sirf market close wale session mein)
        if: steps.guard.outputs.skip != 'true'
        run: |
          NOW=$(date +%H%M)
          if [ "$NOW" -ge 1530 ] && [ "$NOW" -lt 2000 ] && [ -f models/tf_scores.json ]; then
            TFS=$(python -c "import json;print(','.join(json.load(open('models/tf_scores.json'))['scores']))")
            python trading_ai.py --market india --finetune --tfs "$TFS" --steps 100000
            python report.py --policy
          fi
      - name: Save (ledger, report, model)
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"
          git add -A ledger.db 2>/dev/null || true
          git add -A docs models 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "bot update $(date +%F_%H%M)"
            git push || (git pull --rebase --autostash && git push)
          fi
